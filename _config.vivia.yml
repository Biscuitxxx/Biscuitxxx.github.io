# Vivia 主题配置（从原博客网页恢复）
# 导航栏
menu:                      # 导航栏上的链接
  Home: /
  Archives: /archives
  About: /about
rss: /atom.xml

home:
  style: default           # default, detail

favicon: /images/AI王牌03.png

# 横幅图片
banner:
  enable: true                  # 是否显示横幅图片
  url: /images/ding.png         # 横幅图片文件路径，相对于 /source 目录
  position: center              # 决定图片将如何被裁剪
  onAllPages: true              # 在所有页面上显示横幅

# 外观
hue: 250                        # 主题色调

# 个人信息
avatar: /images/head04.jpg
author: 谢许鑫
subtitle: 五花马、千金裘，呼儿将出换美酒，与尔同销万古愁
links:
  - name: B站
    icon: fa-brands fa-bilibili
    url: https://www.bilibili.com/
  - name: 知乎
    icon: fa-brands fa-zhihu
    url: https://www.zhihu.com
  - name: GitHub
    icon: fa-brands fa-github
    url: https://github.com

# 侧边栏
sidebar:
  widgets:                 # 需要启用的组件 (profile, category, tag, archive, recent_posts)
    normal:                # 随页面滚动的组件
      - profile
    sticky:                # 固定在页面顶部的组件
      - category
      - tag
      - archive
      - recent_posts

# 侧边栏组件设置
archive_type: 'monthly'
recent_posts_limits: 5
categories:
  max_depth: 2             # 分类组件中显示的最大目录深度

# 第三方评论系统
comment:
  valine:
    enable: true           # 是否启用 Valine 评论系统
    appId: uYYhyu3UUD2PvncFkGqmg3pI-MdYXbMMI
    appKey: DuQcw62EK2FTTHN5xTU9QCNA
    placeholder: 快来留下你的想法吧~
    pageSize: 10
    highlight: true
    serverURLs: https://uyyhyu3u.api.lncldglobal.com
  twikoo:
    enable: false
    envID:
    region:
    path: location.pathname
    lang:

#Analytics
gauges_analytics: false
google_analytics: false
baidu_analytics: false
